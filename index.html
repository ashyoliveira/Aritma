<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aritma | Calculadora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculadora">

        <span class="etiqueta">JAVASCRIPT</span>

        <h1>Ari<span>tma</span></h1>

        <p>Escolha uma operação para começar.</p>

        <div class="botoes">

            <button id="soma" type="button" onclick="soma()">
                Soma
            </button>

            <button id="sub" type="button" onclick="subtracao()">
                Subtração
            </button>

            <button id="mult" type="button" onclick="multiplicacao()">
                Multiplicação
            </button>

            <button id="div" type="button" onclick="divisao()">
                Divisão
            </button>

        </div>

        <div id="resultado">
            Resultado:
        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
